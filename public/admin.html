<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Minecraft Rewards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --blue: #007aff;
            --red: #ff3b30;
            --green: #39ff14;
            --bg: #05070a;
            --card: #111622;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1;
            filter: blur(80px); opacity: 0.15;
        }

        .container { padding: 25px 20px; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #555; margin: 0; }
        .header .domain { font-size: 22px; font-weight: 900; margin-top: 5px; color: var(--green); text-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }

        .stats-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 15px; text-align: center; }

        .glass-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .main-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
        .stat-val { font-size: 40px; font-weight: 900; color: #fff; line-height: 1; }
        .stat-lbl { font-size: 11px; color: #666; text-transform: uppercase; margin-top: 8px; font-weight: 700; }

        .btn-menu {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            color: white;
            padding: 20px;
            border-radius: 18px;
            width: 100%;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            cursor: pointer;
        }

        .chart-controls { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.05); color: #555; font-weight: 700; font-size: 12px;
        }
        .tab-btn.active.blue { background: var(--blue); color: white; }
        .tab-btn.active.red { background: var(--red); color: white; }

        .btn-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 18px; background: rgba(255,255,255,0.02);
            border-radius: 15px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03);
        }
        .btn-name { font-weight: 600; color: #aaa; font-size: 14px; }
        .btn-count { font-weight: 900; color: var(--green); font-size: 18px; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input {
            width: 100%; padding: 18px; background: #000; border: 1px solid #333;
            border-radius: 14px; color: white; margin: 15px 0; box-sizing: border-box; font-size: 15px;
        }
        .save-btn { background: var(--green); color: #000; border: none; padding: 18px; border-radius: 14px; width: 100%; font-weight: 900; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="header">
        <h1>OFFICIAL ADMIN</h1>
        <div class="domain">MINECRAFT REWARDS</div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="section active">
        <div class="stats-title">Сегодня</div>
        
        <div class="glass-card">
            <div class="main-stats">
                <div class="box">
                    <div class="stat-val" id="v-count">0</div>
                    <div class="stat-lbl">Визиты</div>
                </div>
                <div class="box">
                    <div class="stat-val" id="c-count">0</div>
                    <div class="stat-lbl">Клики</div>
                </div>
            </div>
        </div>

        <button class="btn-menu" onclick="showSection('stats-screen')">
            ДЕТАЛЬНАЯ СТАТИСТИКА <span>📊</span>
        </button>
        <button class="btn-menu" onclick="showSection('link-screen')">
            ИЗМЕНИТЬ ССЫЛКУ <span>🔗</span>
        </button>
    </div>

    <!-- ПОДРОБНАЯ СТАТИСТИКА -->
    <div id="stats-screen" class="section">
        <button onclick="showSection('main-screen')" style="background:none; border:none; color:var(--blue); font-weight:800; margin-bottom:15px; cursor:pointer;">← НАЗАД</button>
        
        <div class="chart-controls">
            <button id="btnVisits" class="tab-btn active blue" onclick="toggleDataset(0)">ВИЗИТЫ</button>
            <button id="btnClicks" class="tab-btn active red" onclick="toggleDataset(1)">КЛИКИ</button>
        </div>

        <div class="glass-card" style="padding: 10px;">
            <canvas id="detailedChart" height="250"></canvas>
        </div>

        <div class="stats-title" style="text-align: left; font-size: 16px;">Эффективность кнопок</div>
        <div id="btn-stats-container">
            <!-- Сюда попадут клики -->
        </div>
    </div>

    <!-- НАСТРОЙКА ССЫЛКИ -->
    <div id="link-screen" class="section">
        <button onclick="showSection('main-screen')" style="background:none; border:none; color:var(--blue); font-weight:800; margin-bottom:15px; cursor:pointer;">← НАЗАД</button>
        <div class="stats-title">Управление редиректом</div>
        <div class="glass-card">
            <input type="text" id="urlInput" placeholder="https://...">
            <button class="save-btn" onclick="saveLink()">СОХРАНИТЬ</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // КОНФИГУРАЦИЯ (Твои ключи из индекса)
    const S_URL = 'https://exlicdagocuvbjgjcdjv.supabase.co';
    const S_KEY = 'sb_publishable_WCWYAHvWLJoKblmD5q9Tcw_jqWQVEAu'; 
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    let fullChart;

    async function init() {
        const { data: clicks } = await supabaseClient.from('click_stats').select('*');
        const { data: settings } = await supabaseClient.from('site_settings').select('url').eq('id', 'main_link').single();
        
        if(settings) document.getElementById('urlInput').value = settings.url;

        const today = new Date().toISOString().split('T')[0];
        const todayData = clicks ? clicks.filter(c => c.created_at.startsWith(today)) : [];
        
        // --- УНИВЕРСАЛЬНАЯ ЛОГИКА РАЗДЕЛЕНИЯ ---
        
        // Визиты: всё, что помечено как visit или direct
        const visitsToday = todayData.filter(c => c.button_id === 'visit' || c.button_id === 'direct').length;
        
        // Клики: ВООБЩЕ ВСЁ ОСТАЛЬНОЕ
        const clicksToday = todayData.filter(c => c.button_id !== 'visit' && c.button_id !== 'direct').length;

        document.getElementById('v-count').innerText = visitsToday;
        document.getElementById('c-count').innerText = clicksToday;

        renderDetailedChart(clicks || []);
        renderButtonStats(clicks || []);
    }

    function renderDetailedChart(allData) {
        const ctx = document.getElementById('detailedChart').getContext('2d');
        const dates = [...new Set(allData.map(c => c.created_at.split('T')[0]))].sort().slice(-7);
        
        const vVals = dates.map(d => allData.filter(c => c.created_at.startsWith(d) && (c.button_id === 'visit' || c.button_id === 'direct')).length);
        const cVals = dates.map(d => allData.filter(c => c.created_at.startsWith(d) && (c.button_id !== 'visit' && c.button_id !== 'direct')).length);

        if(fullChart) fullChart.destroy();
        fullChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates.map(d => d.split('-').reverse().slice(0,2).join('.')),
                datasets: [
                    { label: 'Визиты', data: vVals, borderColor: '#007aff', borderWidth: 3, tension: 0.3, pointRadius: 0 },
                    { label: 'Клики', data: cVals, borderColor: '#ff3b30', borderWidth: 3, tension: 0.3, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#555' } },
                    x: { grid: { display: false }, ticks: { color: '#555' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function renderButtonStats(allData) {
        const container = document.getElementById('btn-stats-container');
        container.innerHTML = '';
        
        // Считаем всё, кроме визитов
        const stats = allData.filter(c => c.button_id !== 'visit' && c.button_id !== 'direct').reduce((acc, curr) => {
            acc[curr.button_id] = (acc[curr.button_id] || 0) + 1;
            return acc;
        }, {});

        const names = { 
            'btn1': '🎮 Игра: Mines', 
            'btn2': '🎮 Игра: Jumper', 
            'bonus': '🎁 БОНУС 10к' 
        };

        const keys = Object.keys(stats);
        if (keys.length === 0) {
            container.innerHTML = '<div style="color:#555; text-align:center; padding:20px;">Кликов пока нет</div>';
            return;
        }

        for (const [id, count] of Object.entries(stats)) {
            const row = document.createElement('div');
            row.className = 'btn-row';
            const label = names[id] || `Кнопка: ${id}`;
            row.innerHTML = `<div class="btn-name">${label}</div><div class="btn-count">${count}</div>`;
            container.appendChild(row);
        }
    }

    function toggleDataset(index) {
        const meta = fullChart.getDatasetMeta(index);
        meta.hidden = meta.hidden === null ? !fullChart.data.datasets[index].hidden : null;
        const btn = index === 0 ? document.getElementById('btnVisits') : document.getElementById('btnClicks');
        btn.classList.toggle('active');
        fullChart.update();
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        tg.HapticFeedback.impactOccurred('light');
    }

    async function saveLink() {
        const url = document.getElementById('urlInput').value;
        if(!url.startsWith('http')) return alert('Введите корректную ссылку!');
        
        const { error } = await supabaseClient.from('site_settings').upsert({ id: 'main_link', url: url });
        if(!error) {
            tg.showAlert('Ссылка успешно сохранена!');
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    // Анимация фона
    const canvas = document.getElementById('bg-canvas');
    const bctx = canvas.getContext('2d');
    let pts = [];
    function binit() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<3; i++) pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()*0.4-0.2, vy: Math.random()*0.4-0.2});
    }
    function banim() {
        bctx.clearRect(0,0,canvas.width, canvas.height);
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            let g = bctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 600);
            g.addColorStop(0, 'rgba(57, 255, 20, 0.15)'); g.addColorStop(1, 'transparent');
            bctx.fillStyle = g; bctx.fillRect(0,0,canvas.width, canvas.height);
        });
        requestAnimationFrame(banim);
    }

    binit(); banim(); init();
    setInterval(init, 10000); 
</script>
</body>
</html>
