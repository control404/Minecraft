<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClickTT Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-green: #00ff88;
            --dark-bg: #0a0a0a;
            --card-glass: rgba(25, 25, 25, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
        }

        .container {
            padding: 20px;
            padding-bottom: 50px;
        }

        /* Карточки */
        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .main-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-green);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Кнопки меню */
        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 18px;
            border-radius: 18px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-btn:active {
            transform: scale(0.98);
            background: rgba(0, 255, 136, 0.1);
        }

        .menu-btn i { color: var(--primary-green); }

        /* Скрытые секции */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            color: var(--primary-green);
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            box-sizing: border-box;
            margin: 15px 0;
        }

        .save-btn {
            background: var(--primary-green);
            color: black;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: 800;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="section active">
        <h2 style="margin-bottom: 5px;">ClickTT Overview</h2>
        <p style="color: #666; margin-bottom: 25px;">Сегодня, 2 мая</p>

        <div class="glass-card">
            <div class="main-stats">
                <div class="stat-box">
                    <div class="stat-value" id="today-visits">0</div>
                    <div class="stat-label">Посещения</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="today-clicks">0</div>
                    <div class="stat-label">Клики</div>
                </div>
            </div>
            <canvas id="miniChart" height="100"></canvas>
        </div>

        <button class="menu-btn" onclick="showSection('stats-screen')">
            📊 Подробная статистика <span>→</span>
        </button>
        <button class="menu-btn" onclick="showSection('link-screen')">
            🔗 Смена реф. ссылки <span>→</span>
        </button>
    </div>

    <!-- ЭКРАН ПОДРОБНОЙ СТАТИСТИКИ -->
    <div id="stats-screen" class="section">
        <button class="back-btn" onclick="showSection('main-screen')">← Назад</button>
        <h3>Детальная аналитика</h3>
        
        <div class="glass-card">
            <canvas id="fullChart"></canvas>
        </div>

        <div id="button-breakdown">
            <!-- Тут будут клики по кнопкам -->
        </div>
    </div>

    <!-- ЭКРАН СМЕНЫ ССЫЛКИ -->
    <div id="link-screen" class="section">
        <button class="back-btn" onclick="showSection('main-screen')">← Назад</button>
        <h3>Настройка редиректа</h3>
        <div class="glass-card">
            <label style="font-size: 12px; color: #888;">АКТУАЛЬНАЯ ССЫЛКА</label>
            <input type="text" id="urlInput">
            <button class="save-btn" onclick="updateLink()">ОБНОВИТЬ СИСТЕМУ</button>
            <div id="status" style="margin-top: 10px; text-align: center; font-size: 14px;"></div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const S_URL = 'https://exlicdagocuvbjgjcdjv.supabase.co';
    const S_KEY = 'sb_publishable_WCWYAHvWLJoKblmD5q9Tcw_jqWQVEAu';
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    // --- АНИМАЦИЯ ФОНА ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let points = [];

    function initBg() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        for(let i=0; i<5; i++) {
            points.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                size: Math.random() * 300 + 200
            });
        }
    }

    function animate() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        points.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
            
            let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            grad.addColorStop(0, '#00ff88');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0, canvas.width, canvas.height);
        });
        requestAnimationFrame(animate);
    }

    // --- ЛОГИКА ИНТЕРФЕЙСА ---
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        tg.HapticFeedback.impactOccurred('light');
    }

    async function loadStats() {
        const today = new Date().toISOString().split('T')[0];

        // 1. Получаем клики за сегодня
        const { data: clicks } = await supabaseClient.from('click_stats').select('*').gte('created_at', today);
        
        document.getElementById('today-visits').innerText = clicks ? clicks.length : 0;
        document.getElementById('today-clicks').innerText = clicks ? clicks.length : 0; // В твоем случае это пока одно и то же

        // Группировка по кнопкам (from)
        const breakdown = {};
        clicks.forEach(c => {
            breakdown[c.button_id] = (breakdown[c.button_id] || 0) + 1;
        });

        const breakdownDiv = document.getElementById('button-breakdown');
        breakdownDiv.innerHTML = '<h4>По кнопкам</h4>';
        for(let key in breakdown) {
            breakdownDiv.innerHTML += `
                <div class="glass-card" style="display:flex; justify-content:space-between; margin-bottom:10px; padding:15px;">
                    <span>Кнопка: <b>${key}</b></span>
                    <span style="color:var(--primary-green)">${breakdown[key]} кликов</span>
                </div>`;
        }

        renderCharts(clicks);
    }

    function renderCharts(data) {
        const ctxMini = document.getElementById('miniChart').getContext('2d');
        new Chart(ctxMini, {
            type: 'line',
            data: {
                labels: ['00:00', '06:00', '12:00', '18:00', '23:59'],
                datasets: [{
                    data: [0, data.length / 2, data.length, data.length * 0.8, data.length],
                    borderColor: '#00ff88',
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 0
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });
    }

    async function updateLink() {
        const newUrl = document.getElementById('urlInput').value;
        const { error } = await supabaseClient.from('site_settings').update({ url: newUrl }).eq('id', 'main_link');
        
        const status = document.getElementById('status');
        if(!error) {
            status.innerText = '✅ ОБНОВЛЕНО';
            status.style.color = '#00ff88';
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    initBg();
    animate();
    loadStats();
    
    // Получаем текущую ссылку
    supabaseClient.from('site_settings').select('url').eq('id', 'main_link').single().then(({data}) => {
        if(data) document.getElementById('urlInput').value = data.url;
    });
</script>
</body>
</html>
