<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --blue: #007aff;
            --red: #ff3b30;
            --green: #34c759;
            --bg: #000;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1;
            filter: blur(60px); opacity: 0.3;
        }

        .container { padding: 20px; }

        .header { text-align: center; margin: 20px 0 30px; }
        .header h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: #666; margin: 0; }
        .header .domain { font-size: 22px; font-weight: 800; margin-top: 5px; color: var(--green); letter-spacing: -0.5px; }

        .stats-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 15px; }

        .glass-card {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .main-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .stat-val { font-size: 36px; font-weight: 900; }
        .stat-lbl { font-size: 11px; color: #888; text-transform: uppercase; margin-top: 4px; }

        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 22px;
            border-radius: 18px;
            width: 100%;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input {
            width: 100%; padding: 18px; background: #1c1c1e; border: 1px solid #333;
            border-radius: 14px; color: white; margin: 15px 0; box-sizing: border-box; font-size: 16px;
        }
        .save-btn { background: var(--blue); color: #fff; border: none; padding: 18px; border-radius: 14px; width: 100%; font-weight: 800; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="header">
        <h1>СТАТИСТИКА</h1>
        <div class="domain">CRAFTDUDL.SITE</div>
    </div>

    <!-- ГЛАВНАЯ -->
    <div id="main-screen" class="section active">
        <div class="stats-title">Статистика за сегодня</div>
        
        <div class="glass-card">
            <div class="main-stats">
                <div class="box">
                    <div class="stat-val" style="color: var(--blue)" id="v-count">0</div>
                    <div class="stat-lbl">Посещения</div>
                </div>
                <div class="box">
                    <div class="stat-val" style="color: var(--red)" id="c-count">0</div>
                    <div class="stat-lbl">Клики</div>
                </div>
            </div>
            <!-- Чистая волна без сеток -->
            <canvas id="liveWave" height="120"></canvas>
        </div>

        <button class="btn" onclick="showSection('stats-screen')">
            ПОДРОБНАЯ СТАТИСТИКА <span>→</span>
        </button>
        <button class="btn" onclick="showSection('link-screen')">
            СМЕНА ССЫЛКИ <span>🔗</span>
        </button>
    </div>

    <!-- ПОДРОБНАЯ СТАТА -->
    <div id="stats-screen" class="section">
        <button onclick="showSection('main-screen')" style="background:none; border:none; color:var(--blue); font-weight:700; margin-bottom:20px;">← НАЗАД</button>
        <div class="stats-title">Аналитика трафика</div>
        
        <div class="glass-card">
            <canvas id="detailedChart" height="250"></canvas>
        </div>
        
        <div id="btn-list"></div>
    </div>

    <!-- СМЕНА ССЫЛКИ -->
    <div id="link-screen" class="section">
        <button onclick="showSection('main-screen')" style="background:none; border:none; color:var(--blue); font-weight:700; margin-bottom:20px;">← НАЗАД</button>
        <div class="stats-title">Реф. ссылка</div>
        <div class="glass-card">
            <input type="text" id="urlInput">
            <button class="save-btn" onclick="saveLink()">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const S_URL = 'https://exlicdagocuvbjgjcdjv.supabase.co';
    const S_KEY = 'sb_publishable_WCWYAHvWLJoKblmD5q9Tcw_jqWQVEAu'; 
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    let waveChart, fullChart;

    async function init() {
        const { data: clicks } = await supabaseClient.from('click_stats').select('*');
        const { data: settings } = await supabaseClient.from('site_settings').select('url').eq('id', 'main_link').single();
        
        if(settings) document.getElementById('urlInput').value = settings.url;

        const today = new Date().toISOString().split('T')[0];
        const todayData = clicks.filter(c => c.created_at.startsWith(today));
        
        document.getElementById('v-count').innerText = todayData.length;
        document.getElementById('c-count').innerText = todayData.length; // Пока считаем 1 к 1

        renderLiveWave(todayData.length);
        renderDetailed(clicks);
    }

    // --- ГЛАВНЫЙ ГРАФИК (ЖИВАЯ ВОЛНА) ---
    function renderLiveWave(count) {
        const ctx = document.getElementById('liveWave').getContext('2d');
        const dataPoints = [0, count * 0.2, count * 0.8, count * 0.5, count];

        waveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['', '', '', '', ''],
                datasets: [{
                    data: dataPoints,
                    borderColor: '#007aff',
                    borderWidth: 4,
                    tension: 0.5,
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } },
                animation: {
                    loop: true,
                    duration: 3000,
                    easing: 'easeInOutSine'
                }
            }
        });
    }

    // --- ПОДРОБНЫЙ ГРАФИК (ДВЕ ЛИНИИ + СЕТКА) ---
    function renderDetailed(allData) {
        const ctx = document.getElementById('detailedChart').getContext('2d');
        
        // Группировка по дням
        const statsByDay = {};
        allData.forEach(d => {
            const day = d.created_at.split('T')[0].split('-').reverse().slice(0,2).join('.');
            statsByDay[day] = (statsByDay[day] || 0) + 1;
        });

        const labels = Object.keys(statsByDay).slice(-7);
        const visits = Object.values(statsByDay).slice(-7);
        const clicks = visits.map(v => Math.floor(v * 0.9)); // Имитация кликов

        fullChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Посещения',
                        data: visits,
                        borderColor: '#007aff',
                        borderWidth: 3,
                        tension: 0.3,
                        pointBackgroundColor: '#007aff'
                    },
                    {
                        label: 'Клики',
                        data: clicks,
                        borderColor: '#ff3b30',
                        borderWidth: 3,
                        tension: 0.3,
                        pointBackgroundColor: '#ff3b30'
                    }
                ]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#666', stepSize: 1 } // Умная разметка
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#666' }
                    }
                },
                plugins: { legend: { labels: { color: '#fff', font: { size: 12 } } } }
            }
        });
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        tg.HapticFeedback.impactOccurred('medium');
    }

    async function saveLink() {
        const url = document.getElementById('urlInput').value;
        const { error } = await supabaseClient.from('site_settings').update({ url }).eq('id', 'main_link');
        if(!error) {
            tg.showAlert('Готово! Ссылка изменена.');
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    // Фон
    const canvas = document.getElementById('bg-canvas');
    const bctx = canvas.getContext('2d');
    let pts = [];
    function binit() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        for(let i=0; i<3; i++) pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()*1-0.5, vy: Math.random()*1-0.5});
    }
    function banim() {
        bctx.clearRect(0,0,canvas.width, canvas.height);
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1;
            if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            let g = bctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 500);
            g.addColorStop(0, 'rgba(0, 255, 136, 0.15)'); g.addColorStop(1, 'transparent');
            bctx.fillStyle = g; bctx.fillRect(0,0,canvas.width, canvas.height);
        });
        requestAnimationFrame(banim);
    }

    binit(); banim(); init();
</script>
</body>
</html>
