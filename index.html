<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --blue: #007aff;
            --red: #ff3131;
            --gold: #ffcc00;
            --green: #39ff14;
        }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100%; width: 100%; overflow: hidden; }

        /* ЭКРАН ЗАГЛУШКИ (ВИДЕН ВСЕГДА ПО УМОЛЧАНИЮ) */
        #tiktok-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 100000;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 40px; overflow-y: auto;
        }

        /* СИНЯЯ СТРЕЛКА (УКАЗЫВАЕТ НА ТРИ ТОЧКИ) */
        .top-arrow {
            position: absolute; top: 10px; right: 15px;
            font-size: 80px; color: var(--blue);
            animation: bounce 0.6s infinite alternate;
            z-index: 100001; text-shadow: 0 0 30px var(--blue);
            line-height: 1; pointer-events: none;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }

        /* ЦЕНТРАЛЬНАЯ КАРТОЧКА */
        .tt-card {
            background: #111622; border-radius: 28px; padding: 30px 20px;
            border: 2px solid var(--blue); box-shadow: 0 0 50px rgba(0,122,255,0.4);
            width: 85%; max-width: 340px; text-align: center; margin-bottom: 25px;
        }
        .tt-icon { font-size: 50px; color: var(--red); margin-bottom: 15px; }
        .tt-card h2 { font-size: 24px; font-weight: 900; margin: 0 0 10px; }
        .tt-card p { font-size: 15px; color: #ccc; margin: 0; }

        /* ИНСТРУКЦИЯ СНИЗУ ПОД КАРТОЧКОЙ */
        .tt-steps { width: 85%; max-width: 340px; }
        .step { 
            display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); 
            padding: 15px; border-radius: 20px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); 
        }
        .step-num { 
            min-width: 28px; height: 28px; background: var(--blue); color: #000; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; 
        }
        .step-text { font-size: 14px; font-weight: 700; color: #fff; }

        /* ЭКРАН САЙТА (ИЗНАЧАЛЬНО СПРЯТАН) */
        #browser-view { display: none; height: 100%; overflow-y: auto; }
        
        /* ТВОЙ КОНТЕНТ САЙТА */
        .top-stats { display: flex; justify-content: center; gap: 15px; padding: 12px; font-size: 11px; font-weight: 800; border-bottom: 1px solid #1a1e2e; text-transform: uppercase; }
        .ticker-wrap { width: 100%; overflow: hidden; background: #000; padding: 12px 0; border-bottom: 1px solid var(--green); }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 15s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 20px; font-size: 13px; font-weight: 900; color: var(--green); }
        @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .container { padding: 15px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .game-card { background: #111622; border-radius: 18px; padding: 10px; text-align: center; border: 2px solid transparent; }
        .game-card img { width: 100%; border-radius: 12px; margin-bottom: 10px; display: block; }
        .play-btn { display: block; padding: 12px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 14px; font-weight: 900; text-align: center; background: var(--green); }
        .promo-card { background: #111622; border-radius: 20px; padding: 15px; margin-top: 15px; text-align: center; border: 2px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="tiktok-view">
        <div class="top-arrow">▲</div>
        
        <div class="tt-card">
            <div class="tt-icon">▲</div>
            <h2>Открыть в браузере</h2>
            <p>Нажмите на <b>три точки</b> в углу и выберите <b>"Открыть в браузере"</b></p>
        </div>

        <div class="tt-steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">Нажмите на <b>...</b> сверху</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">Нажмите <b>"Открыть в браузере"</b></div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">Забирайте бонус 25 000 RUB!</div>
            </div>
        </div>
    </div>

    <div id="browser-view">
        <div class="top-stats">
            <span style="color: var(--red);">● 2,860 ONLINE</span>
            <span style="color: var(--green);">● +127 WIN TODAY</span>
        </div>
        <div class="ticker-wrap"><div class="ticker"><span class="ticker-item">ID: 429*** +₽10,492 🔥</span><span class="ticker-item">ID: 723*** +₽451,816 🚀</span></div></div>
        <div class="container">
            <div class="game-grid">
                <div class="game-card" style="border-color: var(--gold);"><img src="mineslot.jpg"><a href="#" class="play-btn">ИГРАТЬ</a></div>
                <div class="game-card" style="border-color: var(--red);"><img src="jumper.jpg"><a href="#" class="play-btn" style="background: var(--red);">ИГРАТЬ</a></div>
            </div>
            <div class="promo-card" style="border-color: var(--blue);"><img src="reg-promo.png" style="width:100%; border-radius: 12px;"><p style="font-weight:900;">МОМЕНТАЛЬНАЯ РЕГИСТРАЦИЯ</p></div>
        </div>
    </div>

    <script>
        function checkAccess() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const urlParams = new URLSearchParams(window.location.search);

            // МАКСИМАЛЬНО ЖЕСТКАЯ ПРОВЕРКА:
            // 1. Если в ссылке есть ?bypass=1 (для тебя)
            // 2. ИЛИ если это НЕ ТикТок, НЕ Инстаграм и НЕ внутренний браузер (WebView)
            const isTikTok = /TikTok|Musically|tt-c/i.test(ua);
            const isInstagram = /Instagram/i.test(ua);
            const isWebView = /wv|Version\/4.0/i.test(ua) || (/(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(ua));

            if (urlParams.has('bypass') || (!isTikTok && !isInstagram && !isWebView)) {
                // ПОКАЗЫВАЕМ САЙТ
                document.getElementById('tiktok-view').style.display = 'none';
                document.getElementById('browser-view').style.display = 'block';
                document.body.style.overflow = 'auto';
            } else {
                // ОСТАВЛЯЕМ ЗАГЛУШКУ
                document.getElementById('tiktok-view').style.display = 'flex';
            }
        }

        window.onload = checkAccess;
    </script>
</body>
</html>
