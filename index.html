<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a; /* Глубокий черный */
            --card-bg: #111622;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-gold: #ffcc00;
            --blue: #007aff;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- ЭКРАН ТИКТОК --- */
        #tiktok-view { display: none; padding: 40px 20px; text-align: center; }
        .tt-card { background: var(--card-bg); border-radius: 20px; padding: 30px; border: 1px solid #242b3d; }

        /* --- ОСНОВНОЙ КОНТЕНТ --- */
        #browser-view { display: none; }

        .top-stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 12px;
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            font-weight: 600;
        }

        /* БЕГУЩАЯ СТРОКА */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: #000;
            padding: 12px 0;
            border-bottom: 1px solid #1a1e2e;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            animation: ticker 20s linear infinite;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 15px;
            font-size: 12px;
            font-weight: 900;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container { padding: 15px; }

        /* ЯРКАЯ СЕТКА ИГР */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        
        .game-card { 
            background: var(--card-bg); 
            border-radius: 18px; 
            padding: 10px; 
            text-align: center;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        /* Золотой неоновый ободок */
        .game-card.mineslot { 
            border-color: var(--neon-gold);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }
        
        /* Красный неоновый ободок */
        .game-card.doodle { 
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.3);
        }

        .game-card img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
        
        .game-name { 
            font-size: 13px; 
            font-weight: 900; 
            margin-bottom: 10px; 
            letter-spacing: 1px;
        }

        /* ГЛЯНЦЕВЫЕ 3D КНОПКИ */
        .play-btn { 
            display: block; 
            padding: 14px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: #fff; 
            font-size: 14px; 
            font-weight: 900; 
            text-transform: uppercase;
            position: relative;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 5px 0 rgba(0,0,0,0.8);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-green { 
            background: linear-gradient(180deg, #44ff00 0%, #228b22 100%);
        }
        
        .btn-red { 
            background: linear-gradient(180deg, #ff4b2b 0%, #ff0844 100%);
        }

        /* БОНУС КАСКАДНЫЙ ЯРКИЙ */
        .bonus-box {
            background: linear-gradient(90deg, rgba(57, 255, 20, 0.15), rgba(0,0,0,0));
            border: 2px dashed var(--neon-green);
            border-radius: 20px;
            padding: 18px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bonus-amount { color: var(--neon-green); font-weight: 900; font-size: 22px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }

        /* ИНСТРУКЦИЯ (ЯРКАЯ) */
        .instruction-box { background: var(--card-bg); border-radius: 20px; border: 1px solid #242b3d; overflow: hidden; }
        .instr-header { padding: 15px; text-align: center; font-weight: 900; background: #1c2231; color: var(--neon-gold); }
        .step { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .step-num { min-width: 28px; height: 28px; background: var(--neon-green); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .step-text { font-size: 14px; font-weight: 600; color: #fff; }

    </style>
</head>
<body>

    <div id="tiktok-view">
        <div class="tt-card">
            <h2>ОТКРЫТЬ В БРАУЗЕРЕ</h2>
            <a href="#" class="play-btn btn-green" style="margin-top:20px;">ОК</a>
        </div>
    </div>

    <div id="browser-view">
        <div class="top-stats">
            <span style="color: #ff4d4d;">● 2860 ОНЛАЙН</span>
            <span style="color: var(--neon-green);">+127 ВЫИГРАЛИ</span>
        </div>

        <div class="ticker-wrap">
            <div class="ticker">
                <span class="ticker-item" style="color: #fff;">ID: 429*** <span style="color: var(--neon-green);">+₽10 492</span></span>
                <span class="ticker-item" style="color: #fff;">ID: 723*** <span style="color: var(--neon-green);">+₽451 816</span></span>
                <span class="ticker-item" style="color: #fff;">ID: 105*** <span style="color: var(--neon-green);">+₽1 200</span></span>
                <span class="ticker-item" style="color: #fff;">ID: 429*** <span style="color: var(--neon-green);">+₽10 492</span></span>
            </div>
        </div>

        <div class="container">
            <div class="game-grid">
                <div class="game-card mineslot">
                    <img src="mineslot.jpg">
                    <div class="game-name" style="color: var(--neon-gold);">MINESLOT</div>
                    <a href="ТВОЯ_ССЫЛКА" class="play-btn btn-green">ИГРАТЬ</a>
                </div>
                <div class="game-card doodle">
                    <img src="jumper.jpg">
                    <div class="game-name" style="color: #ff4d4d;">DOODLE JUMP</div>
                    <a href="ТВОЯ_ССЫЛКА" class="play-btn btn-red">ИГРАТЬ</a>
                </div>
            </div>

            <div class="bonus-box">
                <div>
                    <div style="font-size: 10px; font-weight: 800;">ТВОЙ БОНУС</div>
                    <div class="bonus-amount">25 000 RUB</div>
                </div>
                <div id="timer" style="color: #fff; font-weight: 900; background: #ff3131; padding: 5px 10px; border-radius: 8px;">04:59</div>
            </div>

            <div class="instruction-box">
                <div class="instr-header">КАК ИГРАТЬ? ▲</div>
                <div class="step"><div class="step-num">1</div><div class="step-text">Зарегистрируйся</div></div>
                <div class="step"><div class="step-num">2</div><div class="step-text">Сделай депозит</div></div>
                <div class="step"><div class="step-num">3</div><div class="step-text">Играй и побеждай!</div></div>
            </div>
        </div>
    </div>

    <script>
        function check() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes("tiktok") || ua.includes("instagram")) {
                document.getElementById('tiktok-view').style.display = 'block';
            } else {
                document.getElementById('browser-view').style.display = 'block';
                let time = 299;
                setInterval(() => {
                    let m = Math.floor(time/60);
                    let s = time%60;
                    document.getElementById('timer').innerText = `0${m}:${s<10?'0':''}${s}`;
                    if(time > 0) time--;
                }, 1000);
            }
        }
        window.onload = check;
    </script>
</body>
</html>
