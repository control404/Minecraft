<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Переход...</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #05070a;
            --accent-blue: #007aff;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Экран для ТикТока: теперь вместо черного фона здесь твой скриншот */
        #tt-shield {
            display: none; 
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0; left: 0;
            z-index: 99999;
            /* Ставим твой скриншот FRUTELLA на весь экран */
            background: url('bg.jpg') center center / cover no-repeat;
        }

        /* Твоя идеальная прыгающая стрелка */
        .perfect-arrow {
            position: absolute; 
            top: 15px; 
            right: 25px; 
            width: 85px; 
            height: 85px;
            animation: arrow-bounce 0.8s infinite alternate ease-in-out;
            z-index: 100000;
        }
        /* Сделал стрелку чуть ярче на фоне картинки */
        .perfect-arrow svg { 
            width: 100%; 
            height: 100%; 
            fill: #ffff00; 
            filter: drop-shadow(0 0 20px rgba(255, 255, 0, 1)) drop-shadow(0 0 5px rgba(0,0,0,0.8)); 
        }
        
        @keyframes arrow-bounce { from { transform: translate(0, 0); } to { transform: translate(12px, -18px); } }

        /* Стили для начального экрана загрузки */
        #redirect-screen {
            text-align: center;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--accent-blue);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки для обычных браузеров -->
    <div id="redirect-screen">
        <div class="loader"></div>
        <div class="loading-text">Перенаправление в Telegram...</div>
    </div>

    <!-- Твой экран для TikTok (теперь просто чистая картинка канала и стрелка) -->
    <div id="tt-shield">
        <div class="perfect-arrow">
            <svg viewBox="0 0 24 24"><path d="M21 3L21 11M21 3L13 3M21 3L10 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </div>

    <script>
        const TG_LINK = "https://t.me/frutellacas";
        const BOT_TOKEN = "8874725087:AAH4yZpqT4YTW_76OTnOV2-mh8QaKWZvDsQ";
        const CHAT_ID = "-1003769181399";

        function isTikTok() { 
            return /TikTok|musical_ly|BytedanceWebview/i.test(navigator.userAgent); 
        }

        async function sendNotificationAndGo() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromTag = urlParams.get('from') || 'direct';
            const tgMessage = `🚀 Новый переход! \n📍 Источник: ${fromTag} \n🔗 Куда: ${TG_LINK}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: tgMessage })
                });
            } catch (e) { 
                console.error('Ошибка отправки уведомления:', e); 
            }

            window.location.replace(TG_LINK);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (isTikTok()) {
                document.getElementById('redirect-screen').style.display = 'none';
                document.getElementById('tt-shield').style.display = 'block'; // Меняем флекс на обычный блок для фона
            } else {
                sendNotificationAndGo();
            }
        });
    </script>
</body>
</html>
