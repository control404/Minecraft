<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --blue: #007aff;
            --red: #ff3131;
            --gold: #ffcc00;
            --green: #39ff14;
        }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* ЗАГЛУШКА — ТЕПЕРЬ ОНА ГЛАВНАЯ */
        #tiktok-view { 
            display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 99999; background: var(--bg);
        }

        /* ТА САМАЯ СТРЕЛКА В УГЛУ (УКАЗЫВАЕТ НА ТРИ ТОЧКИ) */
        .top-arrow {
            position: absolute; 
            top: 10px; 
            right: 15px;
            font-size: 70px; 
            color: var(--blue);
            animation: bounceArrow 0.6s infinite alternate;
            line-height: 1;
            z-index: 100000;
            text-shadow: 0 0 20px rgba(0, 122, 255, 0.8);
        }
        @keyframes bounceArrow {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-15px) scale(1.1); }
        }

        .tt-card {
            background: #111622; border-radius: 28px; padding: 35px 20px;
            border: 2px solid var(--blue); box-shadow: 0 0 50px rgba(0,122,255,0.4);
            width: 85%; max-width: 340px; text-align: center; position: relative;
        }
        .tt-icon { font-size: 50px; color: var(--red); margin-bottom: 15px; }
        .tt-card h2 { font-size: 24px; font-weight: 900; margin: 0 0 10px; }
        .tt-card p { font-size: 15px; color: #ccc; margin-bottom: 25px; line-height: 1.4; }

        .step { 
            display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); 
            padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: left;
        }
        .step-num { 
            min-width: 26px; height: 26px; background: var(--blue); color: #000; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; 
        }
        .step-text { font-size: 13px; font-weight: 700; }

        /* КОНТЕНТ САЙТА (СКРЫТ, ПОКА НЕ ВЫЙДЕМ ИЗ ТТ) */
        #browser-view { display: none; }
        .container { padding: 15px; }
        .top-stats { display: flex; justify-content: center; gap: 15px; padding: 12px; font-size: 11px; font-weight: 800; border-bottom: 1px solid #1a1e2e; text-transform: uppercase; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .game-card { background: #111622; border-radius: 18px; padding: 10px; text-align: center; border: 2px solid transparent; }
        .game-card img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
        .play-btn { display: block; padding: 12px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 14px; font-weight: 900; text-align: center; }
        .btn-green { background: linear-gradient(180deg, #44ff00 0%, #228b22 100%); }
    </style>
</head>
<body>

    <div id="tiktok-view">
        <div class="top-arrow">▲</div>
        <div class="tt-card">
            <div class="tt-icon">▲</div>
            <h2>Открыть в браузере</h2>
            <p>Нажмите на <b>три точки</b> в углу и выберите <b>"Открыть в браузере"</b></p>
            <div class="step"><div class="step-num">1</div><div class="step-text">Нажмите на <b>...</b> сверху</div></div>
            <div class="step"><div class="step-num">2</div><div class="step-text">Нажмите <b>"Открыть в браузере"</b></div></div>
            <div class="step"><div class="step-num">3</div><div class="step-text">Получите бонус 25 000 RUB!</div></div>
        </div>
    </div>

    <div id="browser-view">
        <div class="top-stats">
            <span style="color: var(--red);">● 2,860 ONLINE</span>
            <span style="color: var(--green);">● +127 WIN TODAY</span>
        </div>
        <div class="container">
            <div class="game-grid">
                <div class="game-card" style="border-color: var(--gold);">
                    <img src="mineslot.jpg">
                    <a href="ТВОЯ_ССЫЛКА" class="play-btn btn-green">ИГРАТЬ</a>
                </div>
                <div class="game-card" style="border-color: var(--red);">
                    <img src="jumper.jpg">
                    <a href="ТВОЯ_ССЫЛКА" class="play-btn btn-green" style="background: linear-gradient(180deg, #ff4b2b 0%, #ff0844 100%);">ИГРАТЬ</a>
                </div>
            </div>
            </div>
    </div>

    <script>
        function checkMode() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // Если это НЕ мобильный WebView (то есть нормальный браузер)
            // Мы проверяем: если это iOS и есть Safari ИЛИ если это Android и нет метки Version/4.0
            const isInstagram = /Instagram/i.test(ua);
            const isTikTok = /TikTok|Musically/i.test(ua);
            const isWebView = (/iPhone|iPad|iPod/i.test(ua) && !/Safari/i.test(ua)) || (ua.includes('wv') || ua.includes('Version/4.0'));

            if (isTikTok || isInstagram || isWebView) {
                // Оставляем заглушку как есть
                console.log("Внутри приложения");
            } else {
                // Если зашли из нормального браузера - убираем заглушку
                document.getElementById('tiktok-view').style.display = 'none';
                document.getElementById('browser-view').style.display = 'block';
                document.body.style.overflow = 'auto';
            }
        }
        window.onload = checkMode;
    </script>
</body>
</html>
