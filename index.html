<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Переход...</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #05070a;
            --accent-blue: #007aff;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tt-shield {
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0; left: 0;
            z-index: 99999;
            background: #05070a;
        }

        .perfect-arrow {
            position: absolute; top: 15px; right: 25px; width: 85px; height: 85px;
            animation: arrow-bounce 0.8s infinite alternate ease-in-out;
        }
        .perfect-arrow svg { width: 100%; height: 100%; fill: #ffff00; filter: drop-shadow(0 0 15px rgba(255, 255, 0, 0.9)); }
        
        @keyframes arrow-bounce { from { transform: translate(0, 0); } to { transform: translate(12px, -18px); } }

        .shield-modal { 
            background: rgba(17, 22, 34, 0.9); 
            border: 1px solid var(--accent-blue); 
            border-radius: 32px; 
            padding: 35px 20px; 
            text-align: center; 
            width: 100%; 
            max-width: 350px; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .shield-step { 
            background: rgba(255, 255, 255, 0.04); 
            border-radius: 18px; 
            padding: 14px; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            text-align: left; 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .step-num { 
            background: var(--accent-blue); 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            margin-right: 12px; 
            flex-shrink: 0; 
            font-size: 12px; 
            color: white; 
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--accent-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="redirect-screen" style="text-align: center;">
        <div class="loader"></div>
        <div class="loading-text">Перенаправление в Telegram...</div>
    </div>

    <div id="tt-shield">
        <div class="perfect-arrow">
            <svg viewBox="0 0 24 24"><path d="M21 3L21 11M21 3L13 3M21 3L10 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="shield-modal">
            <span style="font-size:45px; display:block; margin-bottom:10px;">⚠️</span>
            <h2 style="font-weight:900; margin:0 0 10px; font-size:20px; text-transform:uppercase; color:white;">Открыть в браузере</h2>
            <p style="color:var(--text-gray); font-size:13px; margin-bottom:20px;">Для корректного перехода выполните действия ниже:</p>
            <div class="shield-step"><div class="step-num">1</div><span style="color:white;">Нажмите на <b>три точки (...)</b> в углу</span></div>
            <div class="shield-step"><div class="step-num">2</div><span style="color:white;">Выберите <b>«Открыть в браузере»</b></span></div>
            <div class="shield-step"><div class="step-num">3</div><span style="color:white;">После этого вы автоматически перейдете в канал!</span></div>
        </div>
    </div>

    <script>
        const TG_LINK = "https://t.me/berlogacas";
        const BOT_TOKEN = "8606085102:AAGYTrjx6BjMYh_GXtw7o1vRz4zSiiehMCA";
        const CHAT_ID = "-1003769181399";

        function isTikTok() { 
            return /TikTok|musical_ly|BytedanceWebview/i.test(navigator.userAgent); 
        }

        async function sendNotificationAndGo() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromTag = urlParams.get('from') || 'direct';
            const tgMessage = `🚀 Новый переход! \n📍 Источник: ${fromTag} \n🔗 Куда: ${TG_LINK}`;

            try {
                // Ждем, пока запрос точно долетит до серверов Telegram
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: tgMessage })
                });
            } catch (e) { 
                console.error('Ошибка отправки уведомления:', e); 
            }

            // Только после этого перекидываем на канал
            window.location.replace(TG_LINK);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (isTikTok()) {
                document.getElementById('redirect-screen').style.display = 'none';
                document.getElementById('tt-shield').style.display = 'flex';
            } else {
                sendNotificationAndGo();
            }
        });
    </script>
</body>
</html>
