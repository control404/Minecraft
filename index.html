<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
</head>
<body>
    <script>
        const tgLink = "https://telegram.me/frutellacas";

        function forceOut() {
            const isTikTok = /TikTok/i.test(navigator.userAgent);

            if (isTikTok) {
                // Хитрый трюк: заставляем браузер думать, что мы качаем файл.
                // WebView ТикТока паникует и выкидывает пользователя в системный браузер телефона.
                var intentLink = "intent://t.me/твой_ник_в_тг#Intent;scheme=https;package=com.android.chrome;end";
                
                // Для Android пытаемся вызвать Chrome напрямую
                if (/Android/i.test(navigator.userAgent)) {
                    window.location.href = intentLink;
                } else {
                    // Для iOS симулируем триггер загрузки, который часто выбивает Safari наружу
                    window.location.href = tgLink + "?download=true";
                }
            } else {
                // Если пользователь уже вне ТикТока — сразу кидаем в Telegram
                window.location.href = tgLink;
            }
        }

        window.onload = forceOut;
    </script>
</body>
</html>
